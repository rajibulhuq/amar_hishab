name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate Android project (keeps our pubspec and lib)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml && cp -r lib /tmp/lib
          flutter create . --org com.amarhishab --project-name amar_hishab --platforms android
          cp /tmp/pubspec.yaml pubspec.yaml && rm -rf lib && cp -r /tmp/lib lib
          rm -f test/widget_test.dart
          sed -i 's/android:label="[^"]*"/android:label="আমার হিসাব"/' android/app/src/main/AndroidManifest.xml
      - run: flutter clean
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze || true
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: amar-hishab-apk
          path: build/app/outputs/flutter-apk/app-release.apk
